    int m2 = (A[1][0] + A[1][1]) * B[0][0];

int:{n:"Large Integers",note:"Split X = a·10^m + b and Y = c·10^m + d. Then XY = ac·10^2m + (ad + bc)·10^m + bd, which needs 4 smaller multiplications.",lbl:"Two integers X, Y",inp:"1234, 5678",gen:v=>{const [x,y]=v.split(",").map(s=>Math.abs(parseInt(s)));return genInt(Math.min(x||1234,99999),Math.min(y||5678,99999))},rec:"T(n) = 4T(n/2) + n",t:"O(n²)",s:"O(n) per level, O(log n) depth",x:"Here a = 4 > 2^1, so the leaves dominate: Θ(n^log₂4) = Θ(n²). Splitting alone gives no speed-up over the classical digit-by-digit method.",lg:"",code:"int"},
str:{n:"Strassen",note:"Plain D&C matrix multiplication uses 8 block products, giving O(n³). Strassen computes 7 products M1 to M7 and recombines them with additions.",lbl:"A | B (2×2 each, row by row)",inp:"1, 2, 3, 4 | 5, 6, 7, 8",gen:v=>{const p=v.split("|").map(s=>s.split(",").map(Number)),ok=q=>q&&q.length==4&&!q.some(isNaN);return genStr(ok(p[0])?p[0]:[1,2,3,4],ok(p[1])?p[1]:[5,6,7,8])},rec:"T(n) = 7T(n/2) + n²",t:"O(n^log₂7) ≈ O(n^2.807)",s:"O(n²) space, O(log n) stack",x:"Normal D&C: 8T(n/2) + n² gives O(n³). Strassen has more additions and uses extra memory, so it is slower for small matrices.",lg:"",code:"str"},
toh:{n:"Tower of Hanoi",note:"Move n disks from A to C using B. Step 1: move n−1 disks A→B. Step 2: move the largest disk A→C. Step 3: move n−1 disks B→C.",lbl:"Number of disks (1 to 5)",inp:"3",gen:v=>genHanoi(Math.min(5,Math.max(1,parseInt(v)||3))),rec:"T(n) = 2T(n−1) + 1",t:"O(2ⁿ), exactly 2ⁿ − 1 moves",s:"O(n) recursion stack",x:"The size shrinks by subtraction (n−1), not division, so the Master theorem does not apply. Use the recursion tree: 1 + 2 + 4 + … + 2ⁿ⁻¹ = 2ⁿ − 1.",lg:"",code:"toh"},
sub:{n:"Substitution Method",note:"Guess the bound, assume it holds for smaller inputs, substitute into the recurrence, and verify.",lbl:"Example",sel:["T(n) = T(n−1) + 1","T(n) = 2T(n/2) + n"],gen:v=>genSub(+v),rec:"Guess → Assume → Substitute → Verify",t:"Works for almost any recurrence, and is rigorous",s:"Needs a good guess, and can be long",x:"",lg:""},
tree:{n:"Recursion Tree Method",note:"Expand the recurrence into a tree, compute the cost of each level, then add the levels. Choose a to see how the answer changes.",lbl:"T(n) = a·T(n/2) + n, with a =",sel:["2","3","4"],gen:v=>genTree(+v,16),rec:"Expand → Cost per level → Add",t:"a = 2: Θ(n log n); a = 3: Θ(n^1.585); a = 4: Θ(n²)",s:"Gives intuition and a good guess for the substitution method",x:"",lg:""}};
function sim(id){const A=PAGES[id];let steps=[],i=0;const C=A.code?CODE[A.code]:null;
$("#view").innerHTML=`<div class="card"><h2>${A.n}</h2><p>${A.note}</p>
<div class="nav sm" id="pn" style="margin-top:14px"><button class="tab on" data-p="s">Simulation</button>${C?'<button class="tab" data-p="c">Code</button>':""}<button class="tab" data-p="x">Complexity</button></div>
<div id="ps"><div class="row"><label>${A.lbl}</label>${A.sel?`<select id="in">${A.sel.map((o,k)=>`<option value="${A.n=="Recursion Tree Method"?o:k}">${o}</option>`).join("")}</select>`:`<input id="in" value="${A.inp}" style="flex:1;min-width:160px">`}<button class="btn pri" id="run">${A.sel?"Restart":"Run"}</button></div>
<div class="vis" id="vis"></div><div class="msg" id="msg"></div>
<div class="row"><button class="btn" id="pv">◀ Prev</button><button class="btn" id="nx">Next ▶</button><button class="btn" id="pl">▶ Play</button><span class="hint" id="cnt"></span></div>
<div class="legend">${A.lg}</div><details><summary>Show step log</summary><div class="log" id="log"></div></details></div>
<div id="pc" style="display:none">${C?`<div class="nav sm" id="lt" style="margin-top:14px">${Object.keys(C).map(l=>`<button class="tab" data-l="${l}">${l}</button>`).join("")}</div><pre id="code"></pre>`:""}</div>
<div id="px" style="display:none"><div class="grid" style="margin-top:14px"><div class="stat"><b>Recurrence</b>${A.rec}</div><div class="stat"><b>Time</b>${A.t}</div><div class="stat"><b>Space</b>${A.s}</div></div>${A.x?`<p>${A.x}</p>`:""}</div></div>`;
$("#pn").onclick=e=>{const p=e.target.dataset.p;if(!p)return;clearInterval(timer);$("#pl").textContent="▶ Play";document.querySelectorAll("#pn .tab").forEach(b=>b.classList.toggle("on",b.dataset.p==p));$("#ps").style.display=p=="s"?"":"none";$("#pc").style.display=p=="c"?"":"none";$("#px").style.display=p=="x"?"":"none"};
if(C){const L=Object.keys(C),setL=l=>{$("#code").textContent=C[l];document.querySelectorAll("#lt .tab").forEach(b=>b.classList.toggle("on",b.dataset.l==l))};$("#lt").onclick=e=>e.target.dataset.l&&setL(e.target.dataset.l);setL(L[0])}
const draw=()=>{const s=steps[i];$("#msg").textContent=s.m.trim();$("#vis").innerHTML=s.v;$("#cnt").textContent="Step "+(i+1)+" of "+steps.length;
$("#log").innerHTML=steps.slice(0,i+1).map((x,k)=>`<div class="${k==i?"cur":""}">${esc(x.m).replace(/^ +/,q=>"\u00a0".repeat(q.length*2))}</div>`).join("");$("#log").scrollTop=1e9};
const run=()=>{clearInterval(timer);$("#pl").textContent="▶ Play";steps=A.gen($("#in").value);i=0;draw()};
$("#run").onclick=run;if(A.sel)$("#in").onchange=run;
$("#nx").onclick=()=>{if(i<steps.length-1){i++;draw()}};$("#pv").onclick=()=>{if(i>0){i--;draw()}};
$("#pl").onclick=()=>{if($("#pl").textContent.includes("Pause")){clearInterval(timer);$("#pl").textContent="▶ Play";return}
if(i>=steps.length-1)i=0;$("#pl").textContent="⏸ Pause";timer=setInterval(()=>{if(i<steps.length-1){i++;draw()}else{clearInterval(timer);$("#pl").textContent="▶ Play"}},1000)};run()}
/* ---------- idea + master ---------- */
function idea(){$("#view").innerHTML=`<div class="card"><h2>The Idea</h2><p>Solve a big problem by breaking it into smaller problems of the same kind, solving those recursively, and combining their answers.</p>
<div class="vis"><div class="tree"><div class="n">Problem of size n</div><div style="display:flex;gap:16px"><span class="n">Subproblem n/2</span><span class="n">Subproblem n/2</span></div><div style="display:flex;gap:16px"><span class="n c">Solve recursively</span><span class="n c">Solve recursively</span></div><div class="n s">Combine the answers</div></div></div>
<table><tr><th>Step</th><th>What happens</th></tr><tr><td><b>1. Divide</b></td><td>Split the input into smaller subproblems</td></tr><tr><td><b>2. Conquer</b></td><td>Solve each subproblem recursively (stop at a base case)</td></tr><tr><td><b>3. Combine</b></td><td>Merge the sub-answers into the final answer</td></tr></table>
<p style="margin-top:18px"><b>General recurrence: T(n) = a·T(n/b) + f(n)</b></p><p class="hint">a = number of subproblems · b = factor the size shrinks by · f(n) = divide + combine work. Example, merge sort: T(n) = 2T(n/2) + n.</p>
<p>Try the Master theorem calculator below, then use the tabs above to explore each method and example problem.</p></div>`;masterPage($("#view"));$("#view").insertAdjacentHTML("beforeend",`<div class="card"><h2>Summary</h2><table><tr><th>Problem</th><th>Recurrence</th><th>Complexity</th></tr><tr><td>Binary search</td><td>T(n/2) + 1</td><td>Θ(log n)</td></tr><tr><td>Merge sort / Max subarray</td><td>2T(n/2) + n</td><td>Θ(n log n)</td></tr><tr><td>Large integers (4 mults)</td><td>4T(n/2) + n</td><td>O(n²)</td></tr><tr><td>Matrix mult. (D&amp;C)</td><td>8T(n/2) + n²</td><td>O(n³)</td></tr><tr><td>Strassen</td><td>7T(n/2) + n²</td><td>O(n^2.807)</td></tr><tr><td>Tower of Hanoi</td><td>2T(n−1) + 1</td><td>O(2ⁿ), exactly 2ⁿ − 1 moves</td></tr></table></div>`)}
function masterPage(emb){const PS=[["Binary search",1,2,0,0],["Merge sort / Max subarray",2,2,1,0],["3T(n/2) + n²",3,2,2,0],["Matrix D&C",8,2,2,0],["Strassen",7,2,2,0],["Large integers (4 mults)",4,2,1,0]];
const H=`<div class="card"><h2>Master Method</h2><p>For T(n) = a·T(n/b) + Θ(n<sup>k</sup> log<sup>p</sup> n), compare <b>a</b> with <b>b<sup>k</sup></b>.</p>
<div class="row"><select id="pr"><option value="">Load an example…</option>${PS.map((p,i)=>`<option value="${i}">${p[0]}</option>`).join("")}</select></div>
<div class="row" style="font-size:18px">T(n) = <input id="ma" type="number" value="2" min="1" style="width:70px"> T(n / <input id="mb" type="number" value="2" min="2" style="width:70px">) + Θ(n<sup><input id="mk" type="number" value="1" step="any" style="width:70px"></sup> log<sup><input id="mp" type="number" value="0" style="width:70px"></sup> n)</div>
<div class="vis" style="min-height:110px;flex-direction:column"><div class="hint" id="m1"></div><div class="msg" id="m2" style="font-size:24px;min-height:0"></div></div>
<table><tr><th>Case</th><th>Condition</th><th>Result</th></tr><tr><td>a &gt; b<sup>k</sup></td><td>leaves dominate</td><td>Θ(n<sup>log<sub>b</sub>a</sup>)</td></tr>
<tr><td>a = b<sup>k</sup></td><td>every level equal</td><td>p &gt; −1: Θ(n<sup>log<sub>b</sub>a</sup> log<sup>p+1</sup> n)<br>p = −1: Θ(n<sup>log<sub>b</sub>a</sup> log log n)<br>p &lt; −1: Θ(n<sup>log<sub>b</sub>a</sup>)</td></tr>
<tr><td>a &lt; b<sup>k</sup></td><td>root dominates</td><td>p ≥ 0: Θ(n<sup>k</sup> log<sup>p</sup> n)<br>p &lt; 0: Θ(n<sup>k</sup>)</td></tr></table>
<p class="hint">Requires a ≥ 1, b &gt; 1. It fails for T(n−1) types, f(n) = 2ⁿ, or sin n.</p></div>`;if(emb)emb.insertAdjacentHTML("beforeend",H);else $("#view").innerHTML=H;
const g=s=>+$(s).value,up=()=>{const a=g("#ma"),b=g("#mb"),k=g("#mk"),p=g("#mp");if(a<1||b<=1){$("#m1").textContent="Need a ≥ 1 and b > 1";$("#m2").textContent="";return}
const L=Math.log(a)/Math.log(b),bk=b**k,n="n^"+f3(L);let r;
const c=Math.abs(a-bk)<1e-9?0:a>bk?1:-1;
if(c>0)r="Θ("+n+")";else if(c==0)r=p>-1?"Θ("+n+" · log^"+(p+1)+" n)":p==-1?"Θ("+n+" · log log n)":"Θ("+n+")";else r=p>=0?"Θ(n^"+k+(p?" · log^"+p+" n":"")+")":"Θ(n^"+k+")";
$("#m1").textContent="log_b a = "+f3(L)+",  b^k = "+f3(bk)+"  →  a "+(c>0?">":c==0?"=":"<")+" b^k";$("#m2").textContent=r};
document.querySelectorAll("#view input").forEach(x=>x.oninput=up);
$("#pr").onchange=e=>{const p=PS[e.target.value];if(!p)return;$("#ma").value=p[1];$("#mb").value=p[2];$("#mk").value=p[3];$("#mp").value=p[4];up()};up()}
/* ---------- navigation ---------- */
const TOP=[["idea","Idea"],["rec","Solving Recurrences"],["max","Max Subarray"],["int","Large Integers"],["str","Strassen"],["toh","Tower of Hanoi"]],REC=[["sub","Substitution"],["tree","Recursion Tree"],["master","Master Method"]];
const mark=(sel,k,a)=>document.querySelectorAll(sel+" .tab").forEach(b=>b.classList.toggle("on",b.dataset.t==k));
$("#nav").innerHTML=TOP.map(t=>`<button class="tab" data-t="${t[0]}">${t[1]}</button>`).join("");
$("#sub").innerHTML=REC.map(t=>`<button class="tab" data-t="${t[0]}">${t[1]}</button>`).join("");
function show(t){clearInterval(timer);const isRec=["sub","tree","master"].includes(t);mark("#nav",isRec?"rec":t);$("#sub").style.display=isRec?"flex":"none";if(isRec)mark("#sub",t);
t=="idea"?idea():t=="master"?masterPage():sim(t)}
$("#nav").onclick=e=>{const t=e.target.dataset.t;if(t)show(t=="rec"?"sub":t)};$("#sub").onclick=e=>{const t=e.target.dataset.t;if(t)show(t)};
show("idea");
</script></body></html>
